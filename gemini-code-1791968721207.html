<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTUA MAGIC | 專屬社課內容</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
      max-width: 800px;
      width: 100%;
    }
    h1 {
      letter-spacing: 3px;
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    p { color: #888888; font-size: 0.95rem; margin-bottom: 24px; }
    .input-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    input[type="password"] {
      padding: 12px 16px;
      font-size: 16px;
      background: #222222;
      border: 1px solid #333333;
      color: #fff;
      border-radius: 8px;
      outline: none;
      width: 220px;
      transition: 0.3s;
    }
    input[type="password"]:focus {
      border-color: #ffffff;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background-color: #cccccc; }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin-top: 20px;
      display: none;
      border-radius: 12px;
      border: 1px solid #333333;
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
    #error-msg { color: #ff5555; font-size: 0.85rem; margin-top: 12px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="password-section">
      <h1>NTUA MAGIC</h1>
      <p>社課教學影片專區．請輸入密碼解鎖觀看</p>
      
      <div class="input-group">
        <input type="password" id="password-input" placeholder="請輸入觀看密碼">
        <button onclick="checkPassword()">解鎖影片</button>
      </div>
      <p id="error-msg">密碼錯誤，請重新輸入</p>
    </div>

    <div id="video-section" class="video-container">
      <iframe id="youtube-frame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // 1. 在這裡設定你的密碼
    const CORRECT_PASSWORD = "你的密碼123"; 
    
    // 2. 在這裡貼上你的 YouTube 影片網址（記得改為 embed 格式或直接貼嵌入網址）
    const YOUTUBE_EMBED_URL = "https://www.youtube.com/embed/你的影片ID?rel=0";

    function checkPassword() {
      const inputPass = document.getElementById("password-input").value;
      const errorMsg = document.getElementById("error-msg");
      const pwdSection = document.getElementById("password-section");
      const videoSection = document.getElementById("video-section");
      const iframe = document.getElementById("youtube-frame");

      if (inputPass === CORRECT_PASSWORD) {
        pwdSection.style.display = "none";
        iframe.src = YOUTUBE_EMBED_URL;
        videoSection.style.display = "block";
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>

</body>
</html>
